[project]
name = "ivda-tutorial-backend"
version = "2.0.0"
description = "Flask API for the IVDA tutorial company dashboard"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-pymongo>=3.0.1",
    "flask-restx>=1.3.2",
    "gunicorn>=26.2.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pymongo>=4.18.3",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
